<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moving your saved progress | Grounded</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF7F2;color:#2C1810;font-family:Barlow,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box;}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:30px;margin:0 0 8px;}
p{margin:0;color:#6B5A4D;font-size:17px;}
@media (prefers-color-scheme: dark){body{background:#1F1A14;color:#F3EDE3;}p{color:#C2B6A4;}}
</style>
</head>
<body>
<main>
<h1 id="t">Moving your saved progress...</h1>
<p id="m">Everything stays on this device.</p>
</main>
<script>
/* Grounded move-in page.
   The old tool addresses (like sprout.growwithgrounded.com) send a person's saved data here,
   either through a hidden frame (postMessage) or inside the link after the # sign.
   Nothing is ever sent to a server: the part of a link after # never leaves the browser.
   Data is written only into this browser, under the same names the tools already use.
   Existing data is never overwritten: if both old and new copies exist, the old copy is kept
   under a backup name so nothing is lost. */
(function () {
  var ALLOWED = {
    'https://sprout.growwithgrounded.com': 'sprout',
    'https://sapling.growwithgrounded.com': 'sapling',
    'https://soultree.growwithgrounded.com': 'soul-tree',
    'https://garden.growwithgrounded.com': 'garden'
  };
  var KEYS = /^(sprout:|sapling_|soul-tree:|tending-the-garden|gg_read_|gg_theme)/;

  function importData(data) {
    var written = 0, kept = 0;
    Object.keys(data || {}).forEach(function (k) {
      if (!KEYS.test(k) || typeof data[k] !== 'string') return;
      try {
        var cur = localStorage.getItem(k);
        if (cur === null) { localStorage.setItem(k, data[k]); written++; }
        else if (cur !== data[k]) { localStorage.setItem('gg-moved-backup:' + k, data[k]); kept++; }
      } catch (e) {}
    });
    try { localStorage.setItem('gg-moved-at', new Date().toISOString()); } catch (e) {}
    return { written: written, kept: kept };
  }

  async function fromHash(h) {
    var m = /^#gg-move=([zr])\.([A-Za-z0-9_-]+)(?:\|(.*))?$/.exec(h);
    if (!m) return null;
    var b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var text;
    if (m[1] === 'z' && typeof DecompressionStream !== 'undefined') {
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      text = await new Response(stream).text();
    } else {
      text = new TextDecoder().decode(bytes);
    }
    return { data: JSON.parse(text), rest: m[3] || '' };
  }

  // 1) Frame mode: an old address opened this page in a hidden frame and posts the data.
  if (window.parent !== window) {
    window.addEventListener('message', function (e) {
      if (!ALLOWED[e.origin] || !e.data || e.data.type !== 'gg-move') return;
      var r = importData(e.data.data);
      e.source.postMessage({ type: 'gg-move-ok', written: r.written, kept: r.kept }, e.origin);
    });
    window.parent.postMessage({ type: 'gg-move-ready' }, '*');
    return;
  }

  // 2) Link mode: the data rides in the link after #, then we continue to the tool.
  var q = new URLSearchParams(location.search);
  var to = q.get('to') || '';
  if (!/^[a-z-]+$/.test(to)) to = '';
  var dest = to ? '/' + to + '/' : '/';
  fromHash(location.hash).then(function (res) {
    if (res) importData(res.data);
    var rest = res && res.rest ? '#' + res.rest.replace(/[^\w-]/g, '') : '';
    history.replaceState(null, '', location.pathname + location.search);
    location.replace(dest + rest);
  }).catch(function () {
    document.getElementById('t').textContent = 'Almost there';
    document.getElementById('m').innerHTML = 'Something went wrong moving your progress. Your saved data is still safe at the old address. <a href="' + dest + '">Continue</a>';
  });
})();
</script>
</body>
</html>

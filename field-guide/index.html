function gvForm(c){
  const T = c.gv || {}, F = {age: T.age || 'adult', parts: (T.parts || []).slice(), level: T.level || 'gentle', start: today(), how: '', by: '', cdate: today(), fromST: null};
  if (!gvPlanted(c) && c.st && typeof stVisits === 'function'){
    const v = stVisits(c.id).find(s => s.scores && Object.values(s.scores).some(x => x != null));
    if (v){ const p = Object.entries(v.scores).filter(([k, x]) => x != null && x < 8).map(([k]) => ST2GV[k]).filter(Boolean);
      if (p.length){ F.parts = GV_PARTS.filter(x => p.includes(x)); F.fromST = v.date; } }
  }
  return F;
}

// ----- the question bank, read from the public maple/checkin.js -----
let SC = null, SC_WAIT = null, SC_FAIL = false;

  if (SC || SC_WAIT) return;
  SC_FAIL = false;

    .then(src => { const w = {}; new Function('window', src)(w); if (!w.MAPLE_CHECKIN || !w.MAPLE_CHECKIN.questions) throw 0; SC = w.MAPLE_CHECKIN; SC_WAIT = null; if (DATA && V.tab === 'maple') render(); })

    : `<div class="card"><p class="muted">Loading the Maple questions...</p></div>`;
}
const spQs = (grade, key) => ((SC.questions[grade] || {})[key]) || [];
const spAns = k => SC.answers.find(a => a[0] === k) || null;

const spFlagged = (q, a) => !!q[3] && (a === 'yes' || a === 'some');

  let sum = 0, n = 0; const qs = spQs(grade, key);
  idxs.forEach(i => { const q = qs[i], a = spAns((qa || {})[i]); if (!q || !a || a[2] == null) return; const v = q[2] === 'r' ? 4 - a[2] : a[2]; sum += (v - 1) / 2; n++; });
  return n ? Math.round(1 + 9 * sum / n) : null;
}
const spSeenScore = v => { const o = SPG().seen.find(x => x[0] === v); return o ? o[2] : null; };
const spGvScore = v => { const o = SPG().grownView.answers.find(x => x[0] === v); return o && o[2] != null ? Math.round(1 + 9 * (o[2] - 1) / 2) : null; };

  const child = spChildScore(run.grade, key, (run.ans || {})[key], spIdx(run)), seen = spSeenScore((run.seen || {})[key]), grown = spGvScore(((run.gv || {}).ans || {})[key]);

  const ix = src.map(x => SP_LV.indexOf(spLvOf(x[0])));

// Minnesota legal holidays (Minn. Stat. 645.44), counted on the day itself, not moved. That keeps a due date early, never late.
function spHolidays(y){
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); const off = (wd - d.getDay() + 7) % 7; return new Date(y, m, 1 + off + 7 * (n - 1)); };
  const last = (m, wd) => { const d = new Date(y, m + 1, 0); return new Date(y, m, d.getDate() - ((d.getDay() - wd + 7) % 7)); };
  const k = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([new Date(y,0,1), nth(0,1,3), nth(1,1,3), last(4,1), new Date(y,5,19), new Date(y,6,4), nth(8,1,1), nth(9,1,2), new Date(y,10,11), nth(10,4,4), new Date(y,11,25)].map(k));
}
// 72 hours, not counting weekends and holidays: walk forward hour by hour, counting only hours on working days.
function spDue(at){
  const d = new Date(at); if (isNaN(d)) return null;
  let left = 72; const hol = {};
  const isOff = t => { const y = t.getFullYear(); hol[y] = hol[y] || spHolidays(y); const key = `${y}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; return t.getDay() === 0 || t.getDay() === 6 || hol[y].has(key); };
  const t = new Date(d);
  while (left > 0){ t.setHours(t.getHours() + 1); if (!isOff(new Date(t.getTime() - 1))) left--; }
  return t;
}

function spToggle(t){
  const a = t.dataset.act, k = t.dataset.k, v = t.dataset.v, on = t.getAttribute('aria-pressed') !== 'true';
  const one = () => t.parentNode.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b === t));
  const flip = arr => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); t.setAttribute('aria-pressed', i < 0); };
  const redraw = () => { spKeep(); const y = $('#run-body').scrollTop; spDraw(); $('#run-body').scrollTop = y; };
  switch(a){
    case 'sp-ans': RUN.ans[k] = RUN.ans[k] || {}; RUN.ans[k][t.dataset.i] = v; one(); break;
    case 'sp-seen': RUN.seen[k] = RUN.seen[k] === v ? '' : v; if (RUN.seen[k]) one(); else t.setAttribute('aria-pressed', false); break;
    case 'sp-gv': RUN.gv.ans[k] = v; one(); break;

    case 'sp-who': flip(RUN.room.who); break;
    case 'sp-gvwhen': RUN.gvWhen = v; return redraw();

    case 'sp-yes': RUN.yes = v; return redraw();
    case 'sp-warm': { const arr = RUN.warm[k] = RUN.warm[k] || [], i = arr.indexOf(+v); if (i >= 0) arr.splice(i, 1); else arr.push(+v); t.setAttribute('aria-pressed', i < 0); break; }
    case 'sp-card': flip(RUN.topic.used); break;

    case 'sp-listen': flip(RUN.safety.listen); return redraw();

    case 'sp-lv': RUN.lv[k] = Object.assign({}, RUN.lv[k], {pick:v}); return redraw();
    case 'sp-told': RUN.told = v; return redraw();
    case 'sp-try': flip(RUN.tryh); break;
  }
  spKeep();
}

// App-ready: every sheet is a real PDF file, made on the device with the shared ../shared/gg-pdf.js (ggPdf, ggSheetBlocks,
// ggSheetHTML, ggPdfFromHTML), then handed to the device's share sheet (text, email, save, print). Desktop browsers
// without a share sheet download it. Nothing is uploaded. Print stays as a web backup (fgSheet below).
async function ggShare(blob, name, title){
  if (window.GGApp) return GGApp.share(blob, name, title);   // one share path for every tool, and the phone's own share sheet in the app
  try {
    const f = new File([blob], name, {type:'application/pdf'});
    if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title}); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved as ' + name + '.');
}

}
const saQs = (grade, key) => ((SAC.questions[grade] || {})[key]) || [];

const SA_BANK = () => (SAC && SAC.bank) || 1;

function saChildScore(grade, key, qa, idxs){
  let sum = 0, n = 0; const qs = saQs(grade, key);
  idxs.forEach(i => { const q = qs[i], a = saAns((qa || {})[i]); if (!q || !a || a[2] == null) return; const v = q[2] === 'r' ? 4 - a[2] : a[2]; sum += (v - 1) / 2; n++; });
  return n ? Math.round(1 + 9 * sum / n) : null;
}
const saSeenScore = v => { const o = SAG().seen.find(x => x[0] === v); return o ? o[2] : null; };
const saGvScore = v => { const o = SAG().grownView.answers.find(x => x[0] === v); return o && o[2] != null ? Math.round(1 + 9 * (o[2] - 1) / 2) : null; };
// Three sources: the student's answers (counts twice), what the guide saw, the grown-up's view.
// The grown-up's view never sets a level alone. Two steps apart is Mixed signals. The optional question never counts.
function saSuggest(run, key){
  const child = saChildScore(run.grade, key, (run.ans || {})[key], saIdx(run)), seen = saSeenScore((run.seen || {})[key]), grown = saGvScore(((run.gv || {}).ans || {})[key]);
  const src = [[child, 2], [seen, 1], [grown, 1]].filter(x => x[0] != null);
  if (child == null && seen == null) return {child, seen, grown, sug:'none', mixed:false};
  const avg = src.reduce((a, x) => a + x[0] * x[1], 0) / src.reduce((a, x) => a + x[1], 0);
  const ix = src.map(x => SP_LV.indexOf(spLvOf(x[0])));

}

function saNext(){

  if (st === 'topic' && !RUN.topic.deck) return alert('Choose a topic, or go back and pick a different visit.');
  if (st === 'safety' && !sf.notAsked && (!sf.safe || !sf.self)) return alert('Ask both safety questions, or check "I didn\'t ask these today" and say why.');

function saToggle(t){

  switch(a){
    case 'sa-ans': RUN.ans[k] = RUN.ans[k] || {}; RUN.ans[k][t.dataset.i] = v; one(); break;
    case 'sa-sens': RUN.sens.a = v; one(); break;
    case 'sa-seen': RUN.seen[k] = RUN.seen[k] === v ? '' : v; if (RUN.seen[k]) one(); else t.setAttribute('aria-pressed', false); break;
    case 'sa-gv': RUN.gv.ans[k] = v; one(); break;

    case 'sa-gvwhen': RUN.gvWhen = v; return redraw();

const wlAnsRow = k => WC.C.answers.find(a => a[0] === k) || null;

function wlScorePart(role, key, arr){
  const qs = wlBank(role)[key] || [], vals = [];
  (arr || []).forEach((a, i) => { const o = wlAnsRow(a); if (!o || o[2] == null || !qs[i]) return; vals.push(qs[i].r ? 3 - o[2] : o[2]); });
  if (!vals.length) return null;

}

    if (r.visit === 'open'){ const im = WLG().impressions.find(x => x[0] === (r.impr || {})[p.key]); v = im && im[2] != null ? im[2] : null; }
    else if (r.visit === 'full' || r.visit === 'quick') v = wlScorePart(r.role, p.key, (r.ans || {})[p.key]);
    if (v != null){ sc[p.key] = v; lv[p.key] = wlLevelOf(v); }

}

  if (items.some((_, k) => Q.ans[k] === undefined)) return;
  const score = items.filter((it, k) => Q.ans[k] === it.a).length, D = wlmData();
  D.last = {v:M.version, date:today(), score};
  if (score >= M.quiz.pass) D.pass = {v:M.version, date:today(), score};
  save(); Q.done = true; Q.score = score; render();
}

// ----- search -----
const htNorm = s => ' ' + htPlain(s).toLowerCase().replace(/[\u2018\u2019']/g, '').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
const HT_STOP = ' a an and are about as at be but by can do does for from get how i if in into is it its me my of on or our should so some that the their them they this to up we what when where who why will with you your talk talking tell telling help helping kid kids child children son daughter teen teens adult someone person people ';
// Kept out of the library object itself, so nothing extra is ever sealed or downloaded with it.
const HT_HAY = new WeakMap();
function htHay(T){
  if (HT_HAY.has(T)) return HT_HAY.get(T);
  const g = htStagesAll().flatMap(st => htStage(T, st)).map(r => r.g.title + ' ' + (r.g.keys || '')).join(' ');
  const h = htNorm([T.title, T.keys || '', T.helper || '', htGroupName(T.group), g].join(' ')); HT_HAY.set(T, h); return h;
}
function htMatch(T, q){
  const w = htNorm(q).trim().split(' ').filter(x => x && !HT_STOP.includes(' ' + x + ' '));
  if (!w.length) return true;
  const hay = htHay(T);
  return w.every(x => hay.includes(' ' + x) || (x.length > 4 && hay.includes(x.slice(0, -1))));
}
function htListHTML(){
  const H = HTG(), q = (V.htq || '').trim(), grp = V.htg || '';
  const list = (H.topics || []).filter(T => (!grp || T.group === grp) && htMatch(T, q));
  const raw = q.toLowerCase(), crisis = q && (HT_CRISIS.test(raw) || HT_ABUSE.test(raw));
  const row = T => `<button class="gitem ht-item" data-act="ht-topic" data-v="${esc(T.id)}"><span class="ht-dots" aria-hidden="true">${htStagesAll().map(st => { const on = htStage(T, st).length; return `<i class="${on ? (st.soon ? 'soon' : 'on') : ''}" style="--sc:${esc(st.color)}"></i>`; }).join('')}</span><span><b>${esc(T.title)}</b><small>${esc(htStagesAll().filter(st => !st.soon && htStage(T, st).length).map(st => st.name).join(', '))}</small></span><span class="arr">&rsaquo;</span></button>`;
  const body = q ? (list.length ? list.map(row).join('') : `<p class="muted" style="margin:6px 0 14px">Nothing matched "${esc(q)}." Try a simpler word, like grief, divorce, or bullying.</p>`)
    : (H.groups || []).filter(g => !grp || g.key === grp).map(g => { const ts = list.filter(T => T.group === g.key); return ts.length ? `<div class="gcat"><h3>${esc(g.name)}</h3><p class="muted" style="font-size:15px">${esc(g.blurb || '')}</p></div>${ts.map(row).join('')}` : ''; }).join('');
  return (crisis ? htCrisisCard(HT_ABUSE.test(raw)) : '') + body;
}

// ---------------- HARD TALKS: CARDS AND PLANS ----------------
// Conversation cards and session plans live in the Field library (FLD.hardTalks.cards and
// FLD.hardTalks.plans), so they open whenever Hard Talks does. Cards: tree cards for each live age
// (Maple, Aspen, Oak), plus topic decks that attach to Hard Talks topics by guide id.
// Plans walk the tree once, roots to fruit: arrive, six parts, close. Each part has a line to say,
// cards, and what to listen for, with a spoken bridge to the next part. A Grove practice sits at
// its own part (read from grove/library.js). Saved plans stay encrypted on this device (DATA.plans).
// "Add to their record" saves a session with kind 'ht' and a plan field. Never what was said.
const CDG = () => (HTG() && HTG().cards) || null;
const PLG = () => (HTG() && HTG().plans) || null;
// Willow joins the tree cards once its deck (hardTalks.cards.base.willow) is in the library (Willow Build Session 3).
const cdAges = () => ['maple','aspen','oak', ...((((CDG() || {}).base || {}).willow) ? ['willow'] : [])];
const CD_SRC = {maple:'maple', aspen:'aspen', oak:'oak', willow:'willow'};
const cdFaith = () => !!(DATA && DATA.settings.htFaith);
const cdTxt = c => c == null ? '' : typeof c === 'string' ? c : (cdFaith() ? c.t : (c.n || c.t));
const cdKind = s => /\.\.\.$/.test(s) ? 'finish' : /^(Show me|Draw|Point)\b/.test(s) ? 'show' : 'q';
const cdKindName = s => cdKind(s) === 'q' ? '' : (((CDG() || {}).kinds || {})[cdKind(s)] || '');
const cdPart = id => ((CDG() || {}).parts || []).find(p => p.id === id) || null;
const cdStageDef = id => htStagesAll().find(s => s.id === id) || {id, name:id, color:'#8B5E1A', ages:''};
const cdStages = () => cdAges().map(cdStageDef);
const cdDeck = id => (CDG().decks || []).find(d => d.id === id) || null;
const cdDeckName = id => id === 'tree' ? (CDG().treeName || 'Tree cards') : ((cdDeck(id) || {}).title || 'Cards');
const cdSlotName = k => k === 'warm' ? (CDG().warmName || 'Warm up') : k === 'close' ? (CDG().closeName || 'Closing') : ((cdPart(k) || {}).name || k);
const cdSlotColor = k => (cdPart(k) || {}).color || '#8B5E1A';
// The cards for one stage, deck, and part (or warm and close, which always come from the tree deck).
function cdPool(stage, deck, k){
  const C = CDG(); if (!C) return [];
  if (k === 'warm' || k === 'close' || deck === 'tree' || !deck) return ((C.base || {})[stage] || {})[k] || [];
  const d = cdDeck(deck); return (d && d[stage] && d[stage][k]) || ((C.base || {})[stage] || {})[k] || [];
}
// Safety topics never get topic cards (cards.guideOnly lists their guide ids).
function cdGuideOnly(T){
  if (!T) return false; if (T.crisis || T.abuse) return true;
  const G = (CDG() || {}).guideOnly || {};
  return htStagesAll().filter(st => !st.soon).some(st => htStage(T, st).some(r => (G[r.src] || []).includes(r.id)));

// A deck names the topics it belongs to (d.topics), so two topics that share a guide never trade
// cards. Decks from before that field fall back to matching by guide id.
function cdDeckFor(T){
  if (!T || !CDG() || cdGuideOnly(T)) return null;
  const D = CDG().decks || [];
  return D.find(d => (d.topics || []).includes(T.id))
    || D.find(d => !d.topics && htStagesAll().filter(st => !st.soon).some(st => htStage(T, st).some(r => ((d.guides || {})[r.src] || []).includes(r.id))))
    || null;
}
// The Hard Talks group a deck sits in, for the deck picker.
function cdDeckGroup(d){
  const ts = HTG().topics || [];
  const T = ts.find(t => (d.topics || []).includes(t.id)) || ts.find(t => cdDeckFor(t) === d);

// Small seeded shuffle, so a plan's cards stay put until someone redraws one.
function cdRand(seed){ let h = 1779033703 ^ String(seed).length; for (let i = 0; i < String(seed).length; i++){ h = Math.imul(h ^ String(seed).charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }

let CS = null;
function cdState(){

// Nine cards to a page, cut lines, and (optionally) a backs page after each, mirrored for long edge flipping.

  for (let p = 0; p < list.length; p += 9){
    const nine = list.slice(p, p + 9);
    pages.push(`<section class="cd-sheet"><div class="cd-grid">${nine.map(r => cdFace(cdCard(r), r.k, r.stage, r.deck, 'cd-p' + (cdTxt(cdCard(r)).length > 95 ? ' cd-long' : ''))).join('')}</div><div class="cd-sfoot">${esc(C.printFoot || '')} &nbsp; ${esc(notice())}</div></section>`);
    if (backs){

      nine.forEach((r, i) => { const row = Math.floor(i / 3), col = i % 3; cells[row * 3 + (2 - col)] = cdBack(r.k, r.stage).replace('class="cd cd-back"', 'class="cd cd-back cd-p"'); });
      pages.push(`<section class="cd-sheet"><div class="cd-grid">${cells.join('')}</div><div class="cd-sfoot">${esc(C.printFoot || '')}</div></section>`);

  // The PDF draws the same cards itself: nine to a page, playing-card size, dashed cut lines, mirrored backs.
  const blocks = () => [{k:'cards', backs:!!backs, foot:(C.printFoot || '') + ' Grounded Field Guide.', cards:list.map(r => { const card = cdCard(r), t = cdTxt(card), st = cdStageDef(r.stage), pt = cdPart(r.k);
    return {head:cdSlotName(r.k), sub:pt ? pt.sub : '', kind:cdKindName(t), t, left:st.name, right:cdDeckName(r.deck), color:cdSlotColor(r.k), backLine:st.name + ', ' + (C.back || 'Hard Talks')}; })}];

// ---------------- OWNER: update a library ----------------
// Library edits never need a code in chat. Download for Editing gives a plain copy to send to a chat.
// Update a Library takes the file a chat gives back (a whole library, or a patch that sets named
// sections), shows what will change, and seals it here with that level's current key. The sealed file
// joins "Ready to upload". Keys and codes never leave this device.
const LEVELS = ['field','staff','owner'];
async function sha12(t){ const h = await crypto.subtle.digest('SHA-256', enc.encode(t)); return Array.from(new Uint8Array(h)).slice(0, 6).map(b => b.toString(16).padStart(2, '0')).join(''); }
const pendingBox = lvl => { const d = DATA.owner.draft; return (d && d.libs && d.libs[lvl]) || BOX[lvl]; };
async function pendingPlain(lvl){
  const d = DATA.owner.draft, k = effKeys()[lvl];
  if (d && d.libs && d.libs[lvl]) return await tryOpen(d.libs[lvl], k);
  return lvl === 'owner' ? OWN : lvl === 'staff' ? LIB : FLD;
}
function pathGet(o, path){ return path.split('.').reduce((a, k) => (a && typeof a === 'object') ? a[k] : undefined, o); }
function pathSet(o, path, val){ const ks = path.split('.'); let a = o; ks.slice(0, -1).forEach(k => { if (!a[k] || typeof a[k] !== 'object') a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = val; }
function pathDel(o, path){ const ks = path.split('.'); const a = pathGet(o, ks.slice(0, -1).join('.')) ; const t = ks.length > 1 ? a : o; if (t && typeof t === 'object') delete t[ks[ks.length - 1]]; }
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
async function downloadForEdit(lvl){
  const plain = await pendingPlain(lvl);
  if (!plain) return alert("This device can't open the " + LEVEL_NAME[lvl] + ' library.');
  const rev = plain._rev || 0, base = await sha12(pendingBox(lvl).ct);
  const file = {_gfg:'library-edit', level:lvl, rev, base, made:today(),
    warning:'Plain, readable copy for editing in a chat. Never upload this file to the website. Delete it when the edit is done.', data:plain};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type:'application/json'}));
  a.download = lvl + '-library-rev' + rev + '-EDIT-do-not-upload.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Downloaded. Never upload it to the site.');
}
async function readUpdate(file){
  let f; try { const txt = await file.text(); if (/window\.GFG_/.test(txt)) return alert("That's a sealed library file for the site. Choose the update file a chat gave you instead (it ends in .json)."); f = JSON.parse(txt); } catch(e){ return alert("That file couldn't be read. Choose the .json update file from the chat."); }
  if (!f || !['library-edit','library-patch'].includes(f._gfg) || !LEVELS.includes(f.level)) return alert("That isn't a Field Guide library update.");
  const lvl = f.level, cur = await pendingPlain(lvl);
  if (!cur) return alert("This device can't open the " + LEVEL_NAME[lvl] + ' library, so it can\'t update it. See "Finish setup."');
  const next = JSON.parse(JSON.stringify(cur)), rows = [], warns = [];
  if (f._gfg === 'library-edit'){
    if (!f.data || typeof f.data !== 'object' || Array.isArray(f.data)) return alert('That update file is empty.');
    Object.keys(next).forEach(k => delete next[k]); Object.assign(next, JSON.parse(JSON.stringify(f.data)));
    const keys = new Set([...Object.keys(cur), ...Object.keys(next)].filter(k => k[0] !== '_'));
    keys.forEach(k => { if (!(k in cur)) rows.push(['Adds', k]); else if (!(k in next)) rows.push(['Removes', k]); else if (!same(cur[k], next[k])) rows.push(['Changes', k]); });
    if (rows.some(r => r[0] === 'Removes')) warns.push('This removes whole sections. Make sure that was meant.');
    if (f.base && f.base !== await sha12(pendingBox(lvl).ct)) warns.push('This file was made from an older copy of the library. Anything changed since then will be undone. If you are not sure, download a fresh copy for editing and redo the change.');
  } else {
    Object.entries(f.set || {}).forEach(([path, val]) => { const had = pathGet(cur, path); if (!same(had, val)) rows.push([had === undefined ? 'Adds' : 'Replaces', path]); pathSet(next, path, JSON.parse(JSON.stringify(val))); });
    (f.remove || []).forEach(path => { if (pathGet(cur, path) !== undefined){ rows.push(['Removes', path]); pathDel(next, path); } });
  }
  if (!rows.length) return alert('Nothing in that file is different from the library as it stands. Nothing to do.');
  next._rev = (cur._rev || 0) + 1; next._updated = today();
  V.upd = {lvl, title: f.title || (f._gfg === 'library-edit' ? 'Edited library' : 'Library update'), note: f.note || '', rows, warns, from: cur._rev || 0, next};
  render(); setTimeout(() => { const el = $('#upd-card'); if (el) el.scrollIntoView({block:'start'}); }, 60);
}
async function sealUpdate(){
  const U = V.upd; if (!U) return;
  const d = ensureDraft(), k = effKeys()[U.lvl];
  if (!k) return alert("This device can't open that library.");
  const box = await seal(await rawKey(k), U.next);
  // The pre-levels Staff code opens the Staff library through its salt. Keep it while the key is unchanged.
  if (!d.keys[U.lvl] && BOX[U.lvl] && BOX[U.lvl].salt) box.salt = BOX[U.lvl].salt;
  d.libs[U.lvl] = box;
  if (U.lvl === 'owner') OWN = U.next; else if (U.lvl === 'staff') LIB = U.next; else FLD = U.next;
  V.upd = null; await persist(); render(); toast('Sealed. It is in "Ready to upload."');
}

// Each print gets its own number, so a print's cleanup never clears a newer print (tapping Print twice quickly).
let PRINT_ID = 0, PRINT_TITLE = null;
function printNow(html, title){
  const id = ++PRINT_ID, root = $('#print-root');
  if (!document.body.classList.contains('print-mode')) PRINT_TITLE = document.title;
  root.innerHTML = html; document.title = title; document.body.classList.add('print-mode');
  const done = () => { window.removeEventListener('afterprint', done); if (id !== PRINT_ID) return; document.body.classList.remove('print-mode'); root.innerHTML = ''; if (PRINT_TITLE != null) document.title = PRINT_TITLE; };
  window.addEventListener('afterprint', done);
  setTimeout(() => { if (id !== PRINT_ID) return; window.print(); setTimeout(() => { if (id === PRINT_ID && document.body.classList.contains('print-mode')) done(); }, 1500); }, 60);
}

// Turns a print sheet into PDF blocks: the sheet header becomes the small line on top, blank form fields get lines
// to write on, signature lines stay signature lines, and every page carries a short footer.
function fgBlocks(html, o = {}){
  const d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html'), b = d.body;
  const mk = (tag, k, t) => { const e = d.createElement(tag); if (k) e.setAttribute('data-pdf-k', k); if (t != null) e.textContent = t; return e; };
  b.querySelectorAll('style').forEach(x => x.remove());
  b.querySelectorAll('.ht-page,.cd-sheet,.pl-print').forEach((pg, i) => { if (i){ const br = d.createElement('div'); br.setAttribute('data-pdf-page', ''); pg.before(br); } });
  b.querySelectorAll('.pr-head,.ht-head').forEach(h => { const r = h.querySelector('.r'); const t = r ? Array.from(r.childNodes).filter(n => n.nodeType === 3).map(n => n.nodeValue.trim()).filter(Boolean).join(': ') : ''; h.replaceWith(mk('div', 'eyebrow', t)); });
  b.querySelectorAll('.pr-field').forEach(f => {
    const l = f.querySelector('.l'), v = f.querySelector('.v'), frag = d.createDocumentFragment(), val = v ? v.textContent.trim() : '';
    if (l && l.textContent.trim()) frag.append(mk('div', 'b', l.textContent.trim()));
    if (val) frag.append(mk('p', 'p', val));
    else { const ln = d.createElement('div'); ln.className = 'write-lines'; for (let i = 0; i < (f.classList.contains('area') ? 5 : 1); i++) ln.append(d.createElement('span')); frag.append(ln); }
    f.replaceWith(frag);
  });
  b.querySelectorAll('.pr-sign').forEach(sg => { const frag = d.createDocumentFragment(); Array.from(sg.children).forEach(c => { const e = d.createElement('div'); e.className = 'sign-line'; e.textContent = c.textContent.trim(); frag.append(e); }); sg.replaceWith(frag); });
  b.querySelectorAll('.pr-cert .name,.ht-page h1').forEach(n => n.setAttribute('data-pdf-k', 'h1'));
  b.querySelectorAll('.ht-from').forEach(n => { n.setAttribute('data-pdf-k', 'b'); const ln = d.createElement('div'); ln.className = 'write-lines'; ln.append(d.createElement('span')); n.after(ln); });
  b.querySelectorAll('[style*="pre-wrap"]').forEach(el => { const frag = d.createDocumentFragment(); el.textContent.split('\n').forEach(t => { if (t.trim()) frag.append(mk('p', /^\s/.test(t) ? 'li' : 'p', t.trim())); }); el.replaceWith(frag); });
  b.querySelectorAll('.pls-h').forEach(n => { const k = Array.from(n.children).map(c => c.textContent.trim()).filter(Boolean); n.textContent = k[0] + (k.length > 1 ? ' (' + k.slice(1).join(', ') + ')' : ''); n.setAttribute('data-pdf-k', 'h2'); });
  b.querySelectorAll('.pls-meta').forEach(n => n.setAttribute('data-pdf-k', 'sub'));
  b.querySelectorAll('.pr-foot,.pls-foot,.ht-tm,.cd-sfoot').forEach(n => n.setAttribute('data-pdf-k', 'i'));
  b.querySelectorAll('.ht-qr').forEach(q => { const u = q.getAttribute('data-url'); if (!u){ q.remove(); return; } const e = d.createElement('div'); e.setAttribute('data-pdf-qr', u); e.textContent = q.getAttribute('data-label') || 'Scan to read the full guide'; q.replaceWith(e); });
  const out = ggPdfFromEl(b, {foot: o.foot || (o.confidential ? 'Confidential. This file is not encrypted.' : 'Grounded Field Guide. growwithgrounded.com')});
  if (o.confidential){ const h = out.findIndex(x => x.k === 'h1'); out.splice(h + 1, 0, {k:'i', t:'Confidential. ' + FG_CONF}); }
  return out;
}

function mergeData(cur, inc){
  const out = JSON.parse(JSON.stringify(cur));
  out.deleted = out.deleted || {clients:{}, sessions:{}};
  const del = inc.deleted || {clients:{}, sessions:{}};
  ['clients','sessions'].forEach(k => Object.entries(del[k] || {}).forEach(([id,ts]) => { out.deleted[k][id] = Math.max(out.deleted[k][id] || 0, ts); }));
  const stats = {added:0, updated:0};
  const fuKey = f => (f.date||'') + '|' + (f.text||'');
  (inc.clients || []).forEach(ic => {
    const i = out.clients.findIndex(c => c.id === ic.id);
    if (i < 0){ out.clients.push(ic); stats.added++; return; }
    const mine = out.clients[i], newer = (ic.u || 0) > (mine.u || 0) ? ic : mine, older = newer === ic ? mine : ic;
    const fus = {}; [...(older.followups||[]), ...(newer.followups||[])].forEach(f => { const k = fuKey(f); fus[k] = fus[k] ? Object.assign({}, fus[k], {done: fus[k].done || f.done}) : Object.assign({}, f); });
    const merged = Object.assign({}, older, newer, {followups: Object.values(fus)});
    // Grove trees: days tended and what they shared combine across devices.
    if (older.gv && newer.gv) merged.gv = Object.assign({}, older.gv, newer.gv, {watered: Object.assign({}, older.gv.watered, newer.gv.watered), journal: Object.assign({}, older.gv.journal, newer.gv.journal)});
    if (newer === ic) stats.updated++;
    out.clients[i] = merged;
  });
  (inc.sessions || []).forEach(is => {
    const i = out.sessions.findIndex(x => x.id === is.id);
    if (i < 0){ out.sessions.push(is); stats.added++; return; }
    if ((is.u || 0) > (out.sessions[i].u || 0)){ out.sessions[i] = is; stats.updated++; }
  });
  // Saved session plans: newest copy wins; deleted ones stay deleted.
  out.deleted.plans = out.deleted.plans || {};
  Object.entries(del.plans || {}).forEach(([id,ts]) => { out.deleted.plans[id] = Math.max(out.deleted.plans[id] || 0, ts); });
  out.plans = out.plans || [];
  (inc.plans || []).forEach(ip => { const i = out.plans.findIndex(x => x.id === ip.id); if (i < 0){ out.plans.push(ip); stats.added++; } else if ((ip.u || 0) > (out.plans[i].u || 0)){ out.plans[i] = ip; stats.updated++; } });
  out.plans = out.plans.filter(x => !(out.deleted.plans[x.id] && out.deleted.plans[x.id] >= (x.u || 0)));
  // Saved presentation decks (Presentations session): newest copy wins; deleted ones stay deleted.
  { const dm = dkMerge(out, inc); stats.added += dm.added; stats.updated += dm.updated; }
  out.clients = out.clients.filter(c => !(out.deleted.clients[c.id] && out.deleted.clients[c.id] >= (c.u || 0)));
  out.sessions = out.sessions.filter(x => !(out.deleted.sessions[x.id] && out.deleted.sessions[x.id] >= (x.u || 0)));
  const tp = inc.training && inc.training.progress || {};
  Object.entries(tp).forEach(([k,v]) => { if (v && !out.training.progress[k]) out.training.progress[k] = v; });
  if (inc.training && inc.training.agreed && !out.training.agreed) out.training.agreed = inc.training.agreed;
  const io = inc.orient || {}; out.orient = Object.assign({lessons:{}, last:null, pass:null, signed:null, staff:null}, out.orient || {});
  Object.entries(io.lessons || {}).forEach(([k,v]) => { if (v && !out.orient.lessons[k]) out.orient.lessons[k] = v; });
  const newer = (a, b) => !a ? b : !b ? a : ((b.v||0) > (a.v||0) || ((b.v||0) === (a.v||0) && (b.date||'') > (a.date||''))) ? b : a;
  ['last','pass','signed','staff'].forEach(k => { out.orient[k] = newer(out.orient[k], io[k]) || null; });
  const im = inc.spmod || {}; out.spmod = Object.assign({lessons:{}, last:null, pass:null, signed:null}, out.spmod || {});
  Object.entries(im.lessons || {}).forEach(([k,v]) => { if (v && !out.spmod.lessons[k]) out.spmod.lessons[k] = v; });
  ['last','pass','signed'].forEach(k => { out.spmod[k] = newer(out.spmod[k], im[k]) || null; });
  const it2 = inc.stmod || {}; out.stmod = Object.assign({lessons:{}, last:null, pass:null, signed:null}, out.stmod || {});
  Object.entries(it2.lessons || {}).forEach(([k,v]) => { if (v && !out.stmod.lessons[k]) out.stmod.lessons[k] = v; });
  ['last','pass','signed'].forEach(k => { out.stmod[k] = newer(out.stmod[k], it2[k]) || null; });
  const ia = inc.samod || {}; out.samod = Object.assign({lessons:{}, last:null, pass:null, signed:null}, out.samod || {});
  Object.entries(ia.lessons || {}).forEach(([k,v]) => { if (v && !out.samod.lessons[k]) out.samod.lessons[k] = v; });
  ['last','pass','signed'].forEach(k => { out.samod[k] = newer(out.samod[k], ia[k]) || null; });
  if (!out.settings.referrals && inc.settings && inc.settings.referrals) out.settings.referrals = inc.settings.referrals;
  out.lastBackup = Math.max(out.lastBackup || 0, inc.lastBackup || 0) || null;
  return {data:out, stats};
}

/* PRESENT (Presentations session, October 2026)
   - The Present tab, for Staff and Owner only. Slide wording lives in the Staff library (LIB.presentations),
     so it is sealed and edited through Update a Library.
   - Build a deck from four choices: subject, audience, format, and in the room or online. Each library slide
     says which formats it belongs to (f: e elevator, o one-on-one, s small group, c conference) and can carry
     wording for one audience (aud) or one setting (live, virtual).
   - A built deck is a plain copy. Editing it never touches the library. Saved decks live in DATA.decks
     (encrypted with the rest of this device's records) and travel in backups. The deck being built and not
     yet saved lives in DATA.dkWork.
   - Present on one screen, or Presenter View with the audience on a second window. Offline, notes, timer.
   - Handouts and speaker notes save as a PDF or print, through fgSheet.
   - The Owner tab's "Speaking and proposals" card reads OWN.speaking (Owner library). Checks are kept in
     DATA.owner.speak.

const dkByLine = d => d.id === 'grounded' ? 'Grow With Grounded' : d.name + ' by Grow With Grounded';
let DK_SHOW = null, DK_TICK = null, DK_AW = null;

function dkList(){ return (DATA.decks = DATA.decks || []); }
function dkCur(){ if (!V.dke) return null; return V.dke === 'work' ? DATA.dkWork || null : dkList().find(x => x.id === V.dke) || null; }
function dkKeep(d){ if (!d) return; d.u = Date.now(); if (d.id) save(); else { DATA.dkWork = d; save(); } }

// ----- building a deck from the library -----
function dkResolve(s, aud, mode){
  const o = JSON.parse(JSON.stringify(s));
  const a = (s.aud && s.aud[aud]) || {}, m = s[mode] || {};
  delete o.aud; delete o.live; delete o.virtual; delete o.f;
  Object.assign(o, JSON.parse(JSON.stringify(a)), JSON.parse(JSON.stringify(m)));
  return {sid: s.id, k: o.k, h: o.h || '', sub: o.sub || '', pts: o.pts || [], cols: o.cols || null, notes: o.notes || '', url: o.url || '', contact: o.contact || '', off: false};
}
function dkBuild(deckId, aud, fmt, mode, name){
  const L = DKL(), D = dkDeckDef(deckId); if (!L || !D) return null;
  const slides = D.slides.filter(s => (s.f || 'osc').includes(fmt)).map(s => dkResolve(s, aud, mode));
  const mn = (L.modeNotes || {})[mode];
  if (mn && slides[0]) slides[0].notes = (slides[0].notes ? slides[0].notes + '\n\n' : '') + mn;
  return {id: null, u: Date.now(), made: today(), lv: L.v || 1, name: name || D.name + ' for ' + dkAud(aud).toLowerCase(), deck: deckId, aud, fmt, mode, slides};
}
const dkShown = d => d.slides.filter(s => !s.off);

// ----- one slide -----
const DK_KIND = {title:'Title', big:'Big line', list:'Points', parts:'Six parts', trees:'The trees', two:'Two columns', ask:'Together', close:'Closing'};
function dkMarkTile(D, cls){
  if (D.mark === 'grounded') return `<div class="${cls} dk-gg"><svg viewBox="0 0 3200 3536" aria-hidden="true"><use href="#g-icon"/></svg></div>`;
  return `<div class="${cls}"><img src="${esc(dkMark(D.mark))}" alt=""></div>`;
}
function dkSlideHTML(s, d, n, of){
  const D = dkDeckDef(d.deck) || {name: d.deck, mark: 'grounded', color: '#8B5E1A'}, L = DKL() || {};
  const c = D.color || '#8B5E1A', st = `style="--dk:${esc(c)}"`;
  const pts = a => (a && a.length) ? `<ul class="dk-pts">${a.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
  const foot = `<div class="dk-foot">${D.mark === 'grounded' ? `<svg class="dk-fm" viewBox="0 0 3200 3536" aria-hidden="true"><use href="#g-icon"/></svg>` : `<img class="dk-fm" src="${esc(dkMark(D.mark))}" alt="">`}<span>${esc(dkByLine(D))}</span><span class="dk-n">${n ? n + ' / ' + of : ''}</span></div>`;
  const h = s.h ? `<h2 class="dk-h">${esc(s.h)}</h2>` : '';
  const sub = s.sub ? `<p class="dk-sub">${esc(s.sub)}</p>` : '';
  switch (s.k){
    case 'title': return `<div class="dks dk-title" ${st}><div class="dk-tl"><div class="dk-by">${D.id === 'grounded' ? 'Chaplaincy for every age and stage' : 'By Grow With Grounded'}</div><h1 class="dk-name">${esc(s.h)}${D.id === 'grounded' ? '' : '<sup>TM</sup>'}</h1>${s.sub ? `<p class="dk-tag">${esc(s.sub)}</p>` : ''}${D.preview ? '<span class="dk-soon">Coming</span>' : ''}<div class="dk-who">${esc([DATA.settings.name, DATA.settings.role].filter(Boolean).join(', '))}</div></div>${dkMarkTile(D, 'dk-tile')}</div>`;
    case 'big': return `<div class="dks dk-big" ${st}><div class="dk-bigin"><h2 class="dk-h">${esc(s.h)}</h2>${sub}</div><div class="dk-n2">${n ? n + ' / ' + of : ''}</div></div>`;
    case 'parts': return `<div class="dks dk-paper" ${st}><div class="dk-body">${h}${sub}<div class="dk-parts">${(L.parts || []).map((p, i) => `<div class="dk-part"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join('')}</div></div>${foot}</div>`;
    case 'trees': return `<div class="dks dk-paper" ${st}><div class="dk-body">${h}${sub}<div class="dk-trees">${(L.trees || []).map(t => `<div class="dk-tree${t[0] === D.mark ? ' on' : ''}"><img src="${esc(dkMark(t[0]))}" alt=""><b>${esc(t[1])}</b><span>${esc(t[2])}</span>${t[3] === 'coming' ? '<i>Coming</i>' : ''}</div>`).join('')}</div></div>${foot}</div>`;
    case 'two': return `<div class="dks dk-paper" ${st}><div class="dk-body">${h}${sub}<div class="dk-two">${(s.cols || []).map(col => `<div><h3 class="dk-ch">${esc(col[0])}</h3>${pts(col[1])}</div>`).join('')}</div></div>${foot}</div>`;
    case 'ask': return `<div class="dks dk-ask" ${st}><div class="dk-bigin"><svg class="dk-askic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9.5L6 17.5v-3H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"/><path d="M17 9h3a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v2.5L15.5 19H12a2 2 0 0 1-1.7-1"/></svg><h2 class="dk-h">${esc(s.h)}</h2>${sub}</div>${foot}</div>`;
    case 'close': { const qr = s.url && window.GGQR ? GGQR.svg(s.url, {label: 'QR code for ' + s.url}) : '';
      return `<div class="dks dk-close" ${st}><div class="dk-tl"><h2 class="dk-h">${esc(s.h)}</h2>${sub}<p class="dk-url">${esc(String(s.url || '').replace(/^https?:\/\//, '').replace(/\/$/, ''))}</p>${s.contact ? `<p class="dk-mail">${esc(s.contact)}</p>` : ''}</div>${qr ? `<div class="dk-qr">${qr}</div>` : ''}</div>`; }
    default: return `<div class="dks dk-paper" ${st}><div class="dk-body">${h}${sub}${pts(s.pts)}</div>${foot}</div>`;
  }
}

// ----- the Present tab -----
function vDK(){
  const L = DKL();
  const head = `<div class="page-head"><div class="eyebrow">Present &middot; Staff and Owner</div><h1>${esc(L ? L.title : 'Present')}</h1><p>${esc(L ? L.lead : 'Talks and decks for every tree.')}</p></div>`;
  if (!L) return head + `<div class="card"><h3>Not in this library yet</h3><p class="muted">The slides live in the Staff library. On an Owner device, open Owner, then Update a Library, and choose the presentations update file. Seal it and upload lib-staff.js.</p></div>`;
  const d = dkCur();
  if (V.dke && d) return dkEditHTML(d);
  const sel = V.dks = V.dks || Object.assign({deck: 'grounded', aud: 'hospice', fmt: 's', mode: 'live'}, DATA.settings.dkLast || {});
  if (!dkDeckDef(sel.deck)) sel.deck = L.decks[0].id;
  const chip = (k, id, label, sm) => `<button type="button" class="chip" data-act="dk-sel" data-v="${esc(k + '|' + id)}" aria-pressed="${sel[k] === id}">${label}${sm ? ` <small class="muted">${esc(sm)}</small>` : ''}</button>`;
  const pre = dkBuild(sel.deck, sel.aud, sel.fmt, sel.mode), F = dkFmt(sel.fmt);
  const saved = dkList().slice().sort((a, b) => (b.u || 0) - (a.u || 0));
  return head + `<div class="card"><div class="dk-intro">${L.intro.map(t => `<p class="muted">${esc(t)}</p>`).join('')}</div></div>
  ${DATA.dkWork ? `<div class="card" style="margin-top:14px;border-left:4px solid var(--gold)"><div class="spread"><div><h3>${esc(DATA.dkWork.name)}</h3><p class="muted">A deck you started and haven't saved.</p></div><div class="row"><button class="btn btn-gold btn-sm" data-act="dk-open" data-v="work">Open</button><button class="btn btn-line btn-sm" data-act="dk-drop">Let It Go</button></div></div></div>` : ''}
  <div class="card" style="margin-top:14px"><h3>Build a talk</h3>
   <label class="f">Subject</label><div class="dk-pick">${L.decks.map(D => `<button type="button" class="dk-pk" data-act="dk-sel" data-v="${esc('deck|' + D.id)}" aria-pressed="${sel.deck === D.id}" style="--dk:${esc(D.color)}">${dkMarkTile(D, 'dk-pkm')}<span><b>${esc(D.name)}</b>${D.preview ? ' <span class="pill">Preview</span>' : ''}<small>${esc(D.who)}</small></span></button>`).join('')}</div>
   <label class="f">Who you're speaking to</label><div class="row">${L.audiences.map(a => chip('aud', a[0], esc(a[1]))).join('')}</div>
   <label class="f">How long you have</label><div class="row">${L.formats.map(f => chip('fmt', f[0], esc(f[1]), f[2])).join('')}</div>
   <label class="f">Where</label><div class="row">${L.modes.map(m => chip('mode', m[0], esc(m[1]))).join('')}</div>
   <p style="margin-top:14px"><b>${pre ? pre.slides.length : 0} slides</b>, ${esc(F[2].toLowerCase())}, with speaker notes on every slide.</p>
   <div class="row" style="margin-top:12px"><button class="btn btn-gold" data-act="dk-make">Make the Deck</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Saved decks</h3>${saved.length ? saved.map(x => { const D = dkDeckDef(x.deck) || {name: x.deck}; return `<div class="list-row"><div class="lr-main"><b>${esc(x.name)}</b><br><small class="muted">${esc(D.name)}, ${esc(dkAud(x.aud).toLowerCase())}, ${esc(dkFmt(x.fmt)[1].toLowerCase())}, ${esc(dkMode(x.mode).toLowerCase())}. ${dkShown(x).length} slides. Changed ${esc(nice(new Date(x.u || Date.now()).toISOString().slice(0, 10)))}.</small></div><div class="row"><button class="btn btn-line btn-sm" data-act="dk-open" data-v="${x.id}">Open</button><button class="btn btn-gold btn-sm" data-act="dk-go" data-v="${x.id}">${icon('play')} Present</button></div></div>`; }).join('') : '<p class="muted">Decks you save show here. They stay on this device, encrypted with your records, and travel in your backups.</p>'}</div>`;
}
function dkEditHTML(d){
  const D = dkDeckDef(d.deck) || {name: d.deck}, F = dkFmt(d.fmt), shown = dkShown(d), L = DKL() || {};
  const old = d.lv && L.v && d.lv < L.v;
  const field = (i, k, label, val, area) => `<label class="f" for="dk-${i}-${k}">${label}</label>${area ? `<textarea id="dk-${i}-${k}" rows="${k === 'notes' ? 4 : 4}" data-dkf="${i}|${k}">${esc(val)}</textarea>` : `<input type="text" id="dk-${i}-${k}" data-dkf="${i}|${k}" value="${esc(val)}">`}`;
  let n = 0;
  const rows = d.slides.map((s, i) => {
    const num = s.off ? '' : ++n;
    const fields = s.k === 'two'
      ? field(i, 'h', 'Heading', s.h) + field(i, 'sub', 'Line under the heading', s.sub) + (s.cols || []).map((c, j) => field(i, 'c' + j + 'h', 'Column ' + (j + 1) + ' heading', c[0]) + field(i, 'c' + j + 'p', 'Column ' + (j + 1) + ' points, one per line', (c[1] || []).join('\n'), true)).join('')
      : field(i, 'h', s.k === 'ask' ? 'Question' : 'Heading', s.h) + (['title', 'big', 'parts', 'trees', 'ask', 'close', 'list'].includes(s.k) ? field(i, 'sub', s.k === 'title' ? 'Tagline' : s.k === 'ask' ? 'What to do' : 'Line under the heading', s.sub) : '') + (s.k === 'list' ? field(i, 'pts', 'Points, one per line', (s.pts || []).join('\n'), true) : '') + (s.k === 'close' ? field(i, 'url', 'Link for the QR code', s.url) : '');
    return `<div class="dk-row${s.off ? ' off' : ''}" id="dk-row-${i}"><div class="dk-th" id="dk-th-${i}">${dkSlideHTML(s, d, num, shown.length)}</div>
     <div class="dk-rm"><div class="spread"><div><span class="pill">${s.off ? 'Hidden' : 'Slide ' + num}</span> <span class="pill gold">${esc(DK_KIND[s.k] || 'Slide')}</span></div>
      <div class="row"><button class="btn btn-line btn-sm" data-act="dk-up" data-v="${i}" aria-label="Move up"${i ? '' : ' disabled'}>Up</button><button class="btn btn-line btn-sm" data-act="dk-down" data-v="${i}" aria-label="Move down"${i < d.slides.length - 1 ? '' : ' disabled'}>Down</button><button class="btn btn-line btn-sm" data-act="dk-off" data-v="${i}">${s.off ? 'Show' : 'Hide'}</button>${s.own ? `<button class="btn btn-line btn-sm" data-act="dk-del" data-v="${i}">Remove</button>` : ''}</div></div>
      <details${(V.dkOpen || []).includes(i) ? ' open' : ''} data-dki="${i}"><summary>Change the words and notes</summary>${fields}${field(i, 'notes', 'Speaker notes', s.notes, true)}</details>
      ${s.notes ? `<p class="muted dk-np">${esc(s.notes.length > 180 ? s.notes.slice(0, 177) + '...' : s.notes)}</p>` : ''}</div></div>`;
  }).join('');
  return `<button class="linkbtn" data-act="dk-back">Back to Present</button>
  <div class="page-head" style="margin-top:10px"><div class="eyebrow">${esc(D.name)} deck</div><h1>${esc(d.name)}</h1><p>For ${esc(dkAud(d.aud).toLowerCase())}, ${esc(F[1].toLowerCase())} (${esc(F[2].toLowerCase())}), ${esc(dkMode(d.mode).toLowerCase())}.</p></div>
  <div class="card"><label class="f" for="dk-name">Deck name</label><input type="text" id="dk-name" data-dkf="name" value="${esc(d.name)}">
   <p style="margin-top:10px"><b>${shown.length} slides showing</b>${d.slides.length > shown.length ? `, ${d.slides.length - shown.length} hidden` : ''}. ${d.id ? 'Saved. Changes save as you go.' : '<span class="pill warn">Not saved yet</span>'}</p>
   ${old ? '<p class="tipbox">The library wording has changed since this deck was made. Your deck keeps its own words. To pick up the new wording, tap Start Over From the Library.</p>' : ''}
   <div class="row" style="margin-top:12px"><button class="btn btn-gold" data-act="dk-go" data-v="${d.id || 'work'}">${icon('play')} Present</button><button class="btn btn-line" data-act="dk-pv" data-v="${d.id || 'work'}">Presenter View</button>${d.id ? '' : '<button class="btn btn-line" data-act="dk-save">Save Deck</button>'}</div>
   <p class="muted" style="font-size:14px;margin-top:8px">Present fills this screen. Presenter View opens the slides in a second window for the projector, and keeps your notes, the next slide, and the timer here.</p>
   <div class="row" style="margin-top:12px"><button class="btn btn-line btn-sm" data-act="dk-hand">${icon('print')} Save or Print Handout</button><button class="btn btn-line btn-sm" data-act="dk-notes">${icon('print')} Save or Print Speaker Notes</button>${d.id ? '<button class="btn btn-line btn-sm" data-act="dk-copy">Make a Copy</button>' : ''}<button class="btn btn-line btn-sm" data-act="dk-reset">Start Over From the Library</button>${d.id ? '<button class="btn btn-line btn-sm" data-act="dk-rm">Delete Deck</button>' : ''}</div></div>
  <div class="dk-rows">${rows}</div>
  <div class="card" style="margin-top:14px"><h3>Add a slide</h3><p class="muted">New slides go at the end. Move them where you want them.</p><div class="row" style="margin-top:10px"><button class="btn btn-line btn-sm" data-act="dk-add" data-v="list">${icon('plus')} Points Slide</button><button class="btn btn-line btn-sm" data-act="dk-add" data-v="big">${icon('plus')} Big Line Slide</button><button class="btn btn-line btn-sm" data-act="dk-add" data-v="ask">${icon('plus')} Together Slide</button></div></div>`;
}
function dkOpenKeep(){ V.dkOpen = Array.from(document.querySelectorAll('details[data-dki][open]')).map(x => +x.getAttribute('data-dki')); }
function dkRerender(){ dkOpenKeep(); const y = window.scrollY; render(); window.scrollTo(0, y); }

// typing in the editor: change the deck, redraw only that slide's picture
function dkInput(t){
  if (!t.dataset || t.dataset.dkf === undefined) return false;
  const d = dkCur(); if (!d) return true;
  const f = t.dataset.dkf;
  if (f === 'name'){ d.name = t.value; dkKeep(d); return true; }
  const [i, k] = f.split('|'), s = d.slides[+i]; if (!s) return true;
  const m = /^c(\d)([hp])$/.exec(k);
  if (m){ s.cols = s.cols || []; const c = s.cols[+m[1]] = s.cols[+m[1]] || ['', []]; if (m[2] === 'h') c[0] = t.value; else c[1] = t.value.split('\n').map(x => x.trim()).filter(Boolean); }
  else if (k === 'pts') s.pts = t.value.split('\n').map(x => x.trim()).filter(Boolean);
  else s[k] = t.value;
  s.edited = 1; dkKeep(d);
  const th = document.getElementById('dk-th-' + i);
  if (th && k !== 'notes'){ const shown = dkShown(d); th.innerHTML = dkSlideHTML(s, d, s.off ? '' : shown.indexOf(s) + 1, shown.length); }
  return true;
}

function dkAct(a, v, t){
  const d = dkCur();
  switch (a){
    case 'dk-sel': { const [k, id] = String(v).split('|'); V.dks = V.dks || {}; V.dks[k] = id; DATA.settings.dkLast = Object.assign({}, V.dks); save(); const y = window.scrollY; render(); window.scrollTo(0, y); return true; }
    case 'dk-make': { const s = V.dks; if (DATA.dkWork && !confirm('You have an unsaved deck, "' + DATA.dkWork.name + '". Making a new one lets it go. Go ahead?')) return true;
      const w = dkBuild(s.deck, s.aud, s.fmt, s.mode); if (!w) return true; DATA.dkWork = w; save(); go('present', {dke: 'work'}); return true; }
    case 'dk-open': go('present', {dke: v}); return true;
    case 'dk-back': go('present'); return true;
    case 'dk-drop': if (confirm('Let this unsaved deck go?')){ DATA.dkWork = null; save(); render(); } return true;
    case 'dk-save': { if (!d) return true; const n = prompt('Name this deck:', d.name); if (n === null) return true;
      d.name = n.trim() || d.name; d.id = uid(); d.u = Date.now(); dkList().push(d); DATA.dkWork = null; save(); go('present', {dke: d.id}); toast('Deck saved.'); return true; }
    case 'dk-copy': { if (!d) return true; const c = JSON.parse(JSON.stringify(d)); c.id = uid(); c.u = Date.now(); c.made = today(); c.name = d.name + ' (copy)'; dkList().push(c); save(); go('present', {dke: c.id}); toast('Copy made.'); return true; }
    case 'dk-rm': { if (!d || !d.id || !confirm('Delete "' + d.name + '"? This cannot be undone.')) return true;
      DATA.deleted = DATA.deleted || {clients: {}, sessions: {}}; DATA.deleted.decks = DATA.deleted.decks || {}; DATA.deleted.decks[d.id] = Date.now();
      DATA.decks = dkList().filter(x => x.id !== d.id); save(); go('present'); return true; }
    case 'dk-reset': { if (!d || !confirm('Start over from the library? Your changes to these slides will be undone. The name stays.')) return true;
      const w = dkBuild(d.deck, d.aud, d.fmt, d.mode, d.name); if (!w) return true; d.slides = w.slides; d.lv = w.lv; dkKeep(d); dkRerender(); return true; }
    case 'dk-up': case 'dk-down': { if (!d) return true; const i = +v, j = a === 'dk-up' ? i - 1 : i + 1; if (j < 0 || j >= d.slides.length) return true;
      [d.slides[i], d.slides[j]] = [d.slides[j], d.slides[i]]; dkKeep(d); dkOpenKeep(); V.dkOpen = (V.dkOpen || []).map(x => x === i ? j : x === j ? i : x); const y = window.scrollY; render(); window.scrollTo(0, y); return true; }
    case 'dk-off': if (d){ d.slides[+v].off = !d.slides[+v].off; dkKeep(d); dkRerender(); } return true;
    case 'dk-del': if (d && confirm('Remove this slide?')){ d.slides.splice(+v, 1); dkKeep(d); V.dkOpen = []; dkRerender(); } return true;
    case 'dk-add': { if (!d) return true; const k = v === 'big' ? 'big' : v === 'ask' ? 'ask' : 'list';
      d.slides.push({sid: 'own-' + uid(), own: 1, k, h: k === 'ask' ? 'Your question' : 'Your heading', sub: k === 'ask' ? (d.mode === 'virtual' ? 'Answer in the chat.' : 'Turn to someone near you.') : '', pts: k === 'list' ? ['A point'] : [], notes: '', off: false});
      dkKeep(d); V.dkOpen = [d.slides.length - 1]; render(); setTimeout(() => { const r = document.getElementById('dk-row-' + (d.slides.length - 1)); if (r) r.scrollIntoView({block: 'center'}); const f = document.getElementById('dk-' + (d.slides.length - 1) + '-h'); if (f){ f.focus(); f.select(); } }, 60); return true; }
    case 'dk-go': case 'dk-pv': { const x = v === 'work' ? DATA.dkWork : dkList().find(y => y.id === v); if (x) dkPresent(x, a === 'dk-pv'); return true; }
    case 'dk-hand': if (d) dkHandout(d); return true;
    case 'dk-notes': if (d) dkSpeakerNotes(d); return true;
    case 'dk-spk': { const ck = (DATA.owner.speak = DATA.owner.speak || {}); if (ck[v]) delete ck[v]; else ck[v] = today(); save(); V.spkOpen = Array.from(document.querySelectorAll('.spk-item[open]')).map(x => x.getAttribute('data-spk')); const y = window.scrollY; render(); window.scrollTo(0, y); return true; }
  }
  if (a.startsWith('dk-s-')) return dkShowAct(a);
  return false;
}

// ----- presenting -----
function dkPresent(d, two){
  const slides = dkShown(d); if (!slides.length) return toast('Every slide is hidden. Show at least one.');
  const F = dkFmt(d.fmt);
  if (typeof SESS_UNTIL !== 'undefined' && SESS_UNTIL && SESS_UNTIL - Date.now() < (F[3] + 10) * 60000) toast('Your unlock time ends at ' + new Date(SESS_UNTIL).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) + '. The Field Guide will lock then.');
  DK_SHOW = {d, slides, i: 0, two: !!two, notes: !!two, black: false, t0: Date.now(), run: true, spent: 0, target: F[3]};
  if (two){
    try { DK_AW = window.open('', 'gg-dk-audience', 'popup=yes,width=1280,height=760'); } catch(e){ DK_AW = null; }
    if (!DK_AW){ DK_SHOW.two = false; toast("A second window couldn't open here. Presenting on this screen instead."); }
    else dkAudienceSetup();
  }
  let el = document.getElementById('dk-show');
  if (!el){ el = document.createElement('div'); el.id = 'dk-show'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Presenting ' + d.name); document.body.appendChild(el); }
  document.body.classList.add('dk-noscroll');
  if (!DK_SHOW.two && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  clearInterval(DK_TICK); DK_TICK = setInterval(dkTick, 1000);
  dkDraw();
}
function dkClock(){ const S = DK_SHOW; return S.spent + (S.run ? Date.now() - S.t0 : 0); }

function dkTick(){

}
function dkDraw(){

    <span class="dk-sp"></span><span class="dk-time"><span id="dk-clock">${dkMMSS(dkClock())}</span> <small>of ${S.target} min</small></span><button class="dk-b dk-tx" data-act="dk-s-pause">${S.run ? 'Pause' : 'Go'}</button>
    ${S.two ? '' : `<button class="dk-b dk-tx" data-act="dk-s-notes" aria-pressed="${S.notes}">Notes</button>`}<button class="dk-b dk-tx" data-act="dk-s-black" aria-pressed="${S.black}">Blank</button><button class="dk-b dk-tx" data-act="dk-s-end">End</button></div>`;
  const notes = `<div class="dk-notes"><div class="eyebrow">Slide ${S.i + 1}${s.h ? ': ' + esc(s.h) : ''}</div>${s.notes ? s.notes.split('\n').filter(x => x.trim()).map(p => `<p>${esc(p)}</p>`).join('') : '<p class="muted">No notes for this slide.</p>'}</div>`;
  if (S.two){
    el.className = 'dk-pv';
    el.innerHTML = `<div class="dk-pvg"><div class="dk-pvc">${cur}</div><div class="dk-pvr"><div class="dk-nextl">${nx ? 'Next' : 'Last slide'}</div><div class="dk-pvn">${nx ? dkSlideHTML(nx, S.d, S.i + 2, of) : ''}</div>${notes}</div></div>${bar}<p class="dk-hint">The audience window: drag it to the projector, then double-click it for full screen.${DK_AW ? '' : ' It was closed. <button class="linkbtn" data-act="dk-s-reopen">Open it again</button>'}</p>`;
    dkAudienceDraw();
  } else {

}
function dkGo(n){ const S = DK_SHOW; if (!S) return; const j = Math.max(0, Math.min(S.slides.length - 1, n)); if (j === S.i && !S.black) return; S.i = j; S.black = false; dkDraw(); }
function dkShowAct(a){
  const S = DK_SHOW; if (!S) return true;

  else if (a === 'dk-s-next') dkGo(S.i + 1);
  else if (a === 'dk-s-notes'){ S.notes = !S.notes; dkDraw(); }
  else if (a === 'dk-s-black'){ S.black = !S.black; dkDraw(); }
  else if (a === 'dk-s-pause'){ if (S.run){ S.spent += Date.now() - S.t0; S.run = false; } else { S.t0 = Date.now(); S.run = true; } dkDraw(); }
  else if (a === 'dk-s-reopen'){ try { DK_AW = window.open('', 'gg-dk-audience', 'popup=yes,width=1280,height=760'); } catch(e){} if (DK_AW) dkAudienceSetup(); dkDraw(); }

function dkClose(){

  const el = document.getElementById('dk-show'); if (el) el.remove();

// The audience window is a blank page this window writes into, so it needs no unlock and holds nothing but the slide on screen.
function dkAudienceSetup(){

  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(DK_SHOW.d.name)}</title><link rel="stylesheet" href="${esc(fonts)}"><style>${DK_CSS}html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;}#a{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}#a .dks{width:min(100vw,177.78vh);}</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true">${sym ? sym.outerHTML : ''}</svg><div id="a"></div></body></html>`);
  w.document.close();
  const key = e => dkKey(e);
  w.document.addEventListener('keydown', key);
  w.document.addEventListener('dblclick', () => { const r = w.document.documentElement; if (r.requestFullscreen) r.requestFullscreen().catch(() => {}); });
  w.document.addEventListener('click', () => dkGo(DK_SHOW ? DK_SHOW.i + 1 : 0));
}
function dkAudienceDraw(){
  const w = DK_AW, S = DK_SHOW; if (!w || w.closed || !S) return;
  const a = w.document.getElementById('a'); if (!a) return;
  a.innerHTML = S.black ? '' : dkSlideHTML(S.slides[S.i], S.d, S.i + 1, S.slides.length);
}
function dkKey(e){
  if (!DK_SHOW) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(k)){ if (k !== 'Enter' || !(e.target && e.target.closest && e.target.closest('button'))){ e.preventDefault(); dkGo(DK_SHOW.i + 1); } }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)){ e.preventDefault(); dkGo(DK_SHOW.i - 1); }
  else if (k === 'Home'){ e.preventDefault(); dkGo(0); }
  else if (k === 'End'){ e.preventDefault(); dkGo(DK_SHOW.slides.length - 1); }
  else if (k === 'b' || k === 'B' || k === '.'){ e.preventDefault(); dkShowAct('dk-s-black'); }
  else if ((k === 'n' || k === 'N') && !DK_SHOW.two){ e.preventDefault(); dkShowAct('dk-s-notes'); }

document.addEventListener('keydown', e => { if (DK_SHOW) dkKey(e); });
// Tap the right side of the slide to go forward, the left to go back. Swipe works too.
(function(){
  let x0 = null, y0 = null;
  document.addEventListener('pointerdown', e => { if (!DK_SHOW || !e.target.closest('[data-dk-stage]')) return; x0 = e.clientX; y0 = e.clientY; });
  document.addEventListener('pointerup', e => {
    if (!DK_SHOW || x0 === null) return; const st = e.target.closest('[data-dk-stage]'); const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ dkGo(DK_SHOW.i + (dx < 0 ? 1 : -1)); return; }
    if (!st || Math.abs(dx) > 10) return; const r = st.getBoundingClientRect(); dkGo(DK_SHOW.i + (e.clientX > r.left + r.width / 3 ? 1 : -1));
  });
})();

// ----- handouts -----
function dkHandBlocks(d){
  const D = dkDeckDef(d.deck) || {name: d.deck}, L = DKL() || {}, H = L.handout || {}, out = [];
  out.push({k: 'eyebrow', t: dkByLine(D)}, {k: 'h1', t: d.name}, {k: 'sub', t: D.tagline || ''});
  dkShown(d).forEach(s => {
    if (s.k === 'title' || s.k === 'close') return;
    if (s.k === 'ask'){ out.push({k: 'h2', t: s.h}, {k: 'lines', n: 3}); return; }
    if (s.k === 'big'){ out.push({k: 'b', t: [s.h, s.sub].filter(Boolean).join(' ')}); return; }
    out.push({k: 'h2', t: s.h});
    if (s.sub && s.k !== 'trees') out.push({k: 'p', t: s.sub});
    if (s.k === 'parts') (L.parts || []).forEach(p => out.push({k: 'li', t: p[0] + ': ' + p[1]}));
    else if (s.k === 'trees') (L.trees || []).forEach(t => out.push({k: 'li', t: t[1] + ': ' + t[2] + (t[3] === 'coming' ? ' (coming)' : '')}));
    else if (s.k === 'two') (s.cols || []).forEach(c => { out.push({k: 'b', t: c[0]}); (c[1] || []).forEach(p => out.push({k: 'li', t: p})); });
    else (s.pts || []).forEach(p => out.push({k: 'li', t: p}));
  });
  out.push({k: 'h2', t: H.notes || 'My notes'}, {k: 'lines', n: 6});
  const cl = dkShown(d).find(s => s.k === 'close'), url = (cl && cl.url) || D.url;
  if (url) out.push({k: 'qr', url, t: (H.qr || 'Scan to open') + ' ' + (D.id === 'grounded' ? 'Grow With Grounded' : D.name)});
  if (H.help) out.push({k: 'i', t: H.help});
  out.push({k: 'foot', t: H.foot || 'Grow With Grounded. growwithgrounded.com'});
  return out;
}
function dkBlocksHTML(blocks){
  return blocks.map(b => b.k === 'h1' ? `<h1>${esc(b.t)}</h1>` : b.k === 'h2' ? `<h2>${esc(b.t)}</h2>` : b.k === 'sub' ? `<p><i>${esc(b.t)}</i></p>` : b.k === 'li' ? `<ul><li>${esc(b.t)}</li></ul>` : b.k === 'b' ? `<p><b>${esc(b.t)}</b></p>`
    : b.k === 'lines' ? `<div class="pr-field area"><div class="l"></div><div class="v"></div></div>` : b.k === 'qr' ? `<div class="ht-qr" data-url="${esc(b.url)}" data-label="${esc(b.t)}">${window.GGQR ? GGQR.svg(b.url, {label: b.t}) : ''}<p>${esc(b.t)}<br>${esc(b.url)}</p></div>`
    : b.k === 'i' ? `<p><i>${esc(b.t)}</i></p>` : b.k === 'eyebrow' || b.k === 'foot' ? '' : `<p>${esc(b.t)}</p>`).join('').replace(/<\/ul><ul>/g, '');
}
function dkHandout(d){
  const blocks = dkHandBlocks(d);
  fgSheet(ph('Handout') + dkBlocksHTML(blocks) + pf(), d.name, {file: d.name + ' handout', blocks: () => blocks});
}
function dkSpeakerNotes(d){
  const D = dkDeckDef(d.deck) || {name: d.deck}, F = dkFmt(d.fmt), out = [];
  out.push({k: 'eyebrow', t: 'Speaker notes'}, {k: 'h1', t: d.name},
    {k: 'sub', t: dkAud(d.aud) + '. ' + F[1] + ', ' + F[2].toLowerCase() + '. ' + dkMode(d.mode) + '. ' + dkShown(d).length + ' slides.'},
    {k: 'i', t: 'For the presenter. Not a handout.'});
  dkShown(d).forEach((s, i) => {
    out.push({k: 'h2', t: (i + 1) + '. ' + (s.h || DK_KIND[s.k] || 'Slide')});
    if (s.sub) out.push({k: 'p', t: s.sub});
    if (s.k === 'two') (s.cols || []).forEach(c => { out.push({k: 'b', t: c[0]}); (c[1] || []).forEach(p => out.push({k: 'li', t: p})); });

  out.push({k: 'foot', t: 'Grounded Field Guide. ' + dkByLine(D) + '.'});
  fgSheet(ph('Speaker notes') + dkBlocksHTML(out) + pf(), d.name + ': speaker notes', {file: d.name + ' speaker notes', blocks: () => out});

// ----- OWNER: Speaking and proposals (OWN.speaking) -----
function vSpeak(){
  const P = (typeof OWN !== 'undefined' && OWN && OWN.speaking) || null; if (!P) return '';
  const ck = DATA.owner.speak = DATA.owner.speak || {};
  const days = s => { if (!s) return ''; const [y, m, dd] = s.split('-').map(Number), t = new Date(), a = new Date(y, m - 1, dd), b = new Date(t.getFullYear(), t.getMonth(), t.getDate()), n = Math.round((a - b) / 86400000); return n > 1 ? n + ' days left' : n === 1 ? 'Due tomorrow' : n === 0 ? 'Due today' : 'Past due'; };
  const tick = (id, text) => { const on = !!ck[id]; return `<button type="button" class="dk-todo" data-act="dk-spk" data-v="${esc(id)}" aria-pressed="${on}"><span class="dk-box">${on ? icon('check') : ''}</span><span>${esc(text)}</span></button>`; };
  const items = (P.items || []).map(it => {
    const fields = (it.fields || []).map(f => `<div class="spk-f"><div class="spread"><b>${esc(f.label)}</b><button class="btn btn-line btn-sm" data-act="copy" data-v="${esc(f.text)}">${icon('copy')} Copy</button></div>${f.note ? `<p class="muted" style="font-size:14px">${esc(f.note)}</p>` : ''}<div class="spk-t">${esc(f.text)}</div><small class="muted">${f.text.length}${f.limit ? ' of ' + f.limit : ''} characters</small></div>`).join('');
    const people = (it.people || []).map(p => `<div class="spk-p"><h4>${esc(p.name)}</h4>${(p.rows || []).map(r => `<div class="list-row"><div class="lr-main"><small class="muted">${esc(r[0])}</small><br>${esc(r[1])}</div>${r[2] ? `<button class="btn btn-line btn-sm" data-act="copy" data-v="${esc(r[1])}">${icon('copy')} Copy</button>` : ''}</div>`).join('')}
      ${p.bio ? `<div class="spk-f"><div class="spread"><b>Bio</b><button class="btn btn-line btn-sm" data-act="copy" data-v="${esc(p.bio)}">${icon('copy')} Copy</button></div><div class="spk-t">${esc(p.bio)}</div><small class="muted">${p.bio.length} characters</small></div>` : ''}${p.note ? `<p class="tipbox">${esc(p.note)}</p>` : ''}</div>`).join('');
    const plan = it.plan ? `<h4 style="margin-top:16px">${esc(it.plan.title || 'Session plan')}</h4>${it.plan.intro ? `<p class="muted">${esc(it.plan.intro)}</p>` : ''}<div class="spk-plan">${it.plan.rows.map(r => `<div class="spk-pr"><b>${esc(r[0])}</b><span class="pill">${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div>` : '';
    const lists = (it.lists || []).map(l => { const n = l.items.filter(x => ck[it.id + '|' + x[0]]).length; return `<h4 style="margin-top:16px">${esc(l.title)} <small class="muted">${n} of ${l.items.length} done</small></h4>${l.items.map(x => tick(it.id + '|' + x[0], x[1])).join('')}`; }).join('');
    const notes = it.notes && it.notes.length ? `<h4 style="margin-top:16px">${esc(it.notesTitle || 'Notes')}</h4><ul class="spk-ul">${it.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    return `<details class="spk-item" data-spk="${esc(it.id)}"${(V.spkOpen || []).includes(it.id) ? ' open' : ''}><summary><b>${esc(it.title)}</b><span>${esc(it.event || '')}${it.due ? ', due ' + esc(nice(it.due)) + ' (' + days(it.due) + ')' : ''}</span></summary>
      ${it.status ? `<p style="margin-top:6px"><span class="pill gold">${esc(it.status)}</span></p>` : ''}${it.lead ? `<p class="muted" style="margin-top:8px">${esc(it.lead)}</p>` : ''}
      ${it.portal ? `<div class="row" style="margin-top:10px"><a class="btn btn-gold btn-sm" href="${esc(it.portal)}" target="_blank" rel="noopener noreferrer">${icon('link')} ${esc(it.portalLabel || 'Open the portal')}</a></div>` : ''}
      ${lists}${fields ? `<h4 style="margin-top:16px">${esc(it.fieldsTitle || 'Fields to paste')}</h4>${fields}` : ''}${people ? `<h4 style="margin-top:16px">Presenters</h4>${people}` : ''}${plan}${notes}
      ${it.source ? `<p class="muted" style="font-size:14px;margin-top:12px">Source: <a href="${esc(it.source)}" target="_blank" rel="noopener noreferrer">${esc(it.sourceLabel || it.source)}</a></p>` : ''}</details>`;
  }).join('');
  return `<div class="card" id="spk-card"><h3>${esc(P.title || 'Speaking and proposals')}</h3><p class="muted">${esc(P.intro || '')}</p><div style="margin-top:8px">${items}</div>
   ${P.ideas && P.ideas.length ? `<h4 style="margin-top:16px">${esc(P.ideasTitle || 'Ideas for later')}</h4><ul class="spk-ul">${P.ideas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
}

// ----- backups: saved decks combine like saved session plans -----
function dkMerge(out, inc){
  out.deleted = out.deleted || {clients: {}, sessions: {}};
  out.deleted.decks = out.deleted.decks || {};
  Object.entries((inc.deleted || {}).decks || {}).forEach(([id, ts]) => { out.deleted.decks[id] = Math.max(out.deleted.decks[id] || 0, ts); });
  out.decks = out.decks || []; let added = 0, updated = 0;
  (inc.decks || []).forEach(x => { const i = out.decks.findIndex(y => y.id === x.id); if (i < 0){ out.decks.push(x); added++; } else if ((x.u || 0) > (out.decks[i].u || 0)){ out.decks[i] = x; updated++; } });
  out.decks = out.decks.filter(x => !(out.deleted.decks[x.id] && out.deleted.decks[x.id] >= (x.u || 0)));
  if (inc.owner && inc.owner.speak){ out.owner = out.owner || {}; out.owner.speak = Object.assign({}, inc.owner.speak, out.owner.speak || {}); }
  return {added, updated};
}

.dk-mail{font-size:2.1cqw;margin-top:.6cqw;opacity:.9;}
.dk-qr{flex:none;background:#fff;border-radius:2.4cqw;padding:2cqw;width:26cqw;height:26cqw;}
.dk-qr svg{width:100%;height:100%;display:block;}
.dk-blank{background:#000;}

if (!window.crypto || !crypto.subtle){ $('#lock-body').innerHTML = '<p class="lock-sub">This browser can\'t run the Field Guide securely. Please open it in a current version of Safari, Chrome, or Edge, from its web address.</p>'; }
else (async () => {
  const v = readVault();
  if (v){
    const ss = await sessGet();
    if (ss && ss.key && ss.until > Date.now()){
      try {
        const inner = await open(ss.key, v);
        VSALT = unb64(v.salt); USERKEY = ss.key; SESS_UNTIL = ss.until;
        const r = await enter(inner);
        if (codeEnded()) throw 0;
        if (r === 'upgrade'){ lockScreen('upgrade'); return; }
        start(); return;
      } catch(e){ await sessClear(); USERKEY = null; DATA = null; }
    } else if (ss) await sessClear();
  }
  lockScreen(v ? 'unlock' : 'access');
})();
})();

(function(){
  var root = document.documentElement, KEY = 'gg_theme', b = document.querySelector('.fg-theme'); if (!b) return;
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

  function eff(){ var a = root.getAttribute('data-theme'); if (a === 'light' || a === 'dark') return a; return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  function paint(){ var d = eff() === 'dark'; b.innerHTML = d ? SUN : MOON; b.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); b.title = d ? 'Light mode' : 'Dark mode'; }
  b.addEventListener('click', function(){
    var t = eff() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t); root.style.colorScheme = t;
    try { localStorage.setItem(KEY, t); } catch (e) {}
    var dom = /(^|\.)growwithgrounded\.com$/.test(location.hostname) ? '; Domain=.growwithgrounded.com' : '';
    document.cookie = KEY + '=' + t + '; Path=/; Max-Age=31536000; SameSite=Lax' + dom;

  });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint); } catch (e) {} }
  paint();
